[pytest]
# 只收集 ui 目录下的 UI 用例（不递归到 api 的 testcases）
python_files = test_*_ui.py
python_classes = Test*
python_functions = test_*

addopts = -v -s --strict-markers --tb=short
    --alluredir=report/allure-results-ui
    --clean-alluredir

markers =
    ui: UI 自动化用例
    smoke: 冒烟用例

log_cli = false
log_level = INFO
