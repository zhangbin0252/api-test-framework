name: API & UI Tests

# 每次推送到 main 或发起 PR 时执行，也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Lint - 检查语法错误和未定义名称
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run API tests
        run: |
          python -m pytest -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: Run UI tests
        run: |
          python -m pytest -c ui/pytest.ini -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            report/allure-results/
            report/allure-results-ui/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: report/screenshots/
          retention-days: 7
