[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 控制台输出
addopts = -v -s --strict-markers --tb=short
    --alluredir=report/allure-results
    --clean-alluredir

# 标记定义
markers =
    smoke: 冒烟用例，核心链路
    regression: 回归用例
    slow: 耗时较长的用例

# 日志
log_cli = false
log_level = INFO
